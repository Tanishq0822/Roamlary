[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roamlary-backend"
version = "1.0.0"
description = "Roamlary backend API - AI-powered travel companion and personal safety service (CODE X 3.0 hackathon prototype)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx2==2.13.1",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
