# Alembic configuration for the Roamlary backend.
#
# Plain language: Alembic is the database's "version control". Each
# schema change becomes a numbered migration file in alembic/versions/,
# so any machine can replay changes from zero to the current schema.
#
# IMPORTANT: no credentials live in this file. The real database URL is
# read from the environment / .env by alembic/env.py at runtime. The
# placeholder below is never used.

[alembic]
script_location = alembic
# Template for migration file names: <revision>_<slug>.py
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url = driver://user:password@localhost:5432/database

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
